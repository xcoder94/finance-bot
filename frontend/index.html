<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Family Budget</title>
    <script>
      // Pre-paint theme: saved explicit choice, else Telegram scheme, else browser scheme, else dark.
      ;(function () {
        var theme = null
        function dark(color) {
          var m = /^#?([0-9a-f]{6})$/i.exec(String(color || ''))
          if (!m) return null
          var n = parseInt(m[1], 16)
          var y = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)
          return y < 128 ? 'dark' : 'light'
        }
        function fromLaunch(raw) {
          raw = String(raw || '').trim()
          if (raw.charAt(0) === '"') {
            try {
              var parsed = JSON.parse(raw)
              if (typeof parsed === 'string') raw = parsed
            } catch (e) {
              raw = raw.replace(/^"/, '').replace(/"$/, '')
            }
          } else if (raw.charAt(raw.length - 1) === '"') {
            raw = raw.slice(0, -1)
          }
          var v = new URLSearchParams(raw.replace(/^#/, '')).get('tgWebAppThemeParams')
          return v ? dark(JSON.parse(v).bg_color) : null
        }
        try {
          var saved = localStorage.getItem('app-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {}
        if (!theme) {
          try {
            var cs = window.Telegram.WebApp.colorScheme
            if (cs === 'light' || cs === 'dark') theme = cs
          } catch (e) {}
        }
        if (!theme) {
          try {
            theme = fromLaunch(location.hash.slice(1))
          } catch (e) {}
        }
        if (!theme) {
          try {
            theme = fromLaunch(sessionStorage.getItem('tapps/launchParams') || '')
          } catch (e) {}
        }
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (e) {}
        }
        document.documentElement.dataset.theme = theme || 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
