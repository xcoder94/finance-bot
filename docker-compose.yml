# Chontak — deploy stack for Coolify.
# PostgreSQL is NOT here: it is an external resource, passed in via DATABASE_URL.
# Startup order: api (runs migrations) -> bot -> web.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: chontak-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      APP_PASS_SECRET: ${APP_PASS_SECRET}
      MINI_APP_URL: ${MINI_APP_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
      SUPPORT_CHAT_ID: ${SUPPORT_CHAT_ID:-}
      PARSER_PROVIDER: ${PARSER_PROVIDER:-}
      PARSER_API_KEY: ${PARSER_API_KEY:-}
      PARSER_MODEL: ${PARSER_MODEL:-}
      DAILY_MODEL_CALL_LIMIT: ${DAILY_MODEL_CALL_LIMIT:-50}
      DAILY_UNPARSED_LIMIT: ${DAILY_UNPARSED_LIMIT:-20}
      RECEIPT_PHOTO_ENABLED: ${RECEIPT_PHOTO_ENABLED:-}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/logs/app.log}
      PORT: ${API_PORT:-5001}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    expose:
      - "${API_PORT:-5001}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${API_PORT:-5001}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: chontak-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "bot.main"]
    # The bot inherits the API image, and with it the image HEALTHCHECK that
    # curls /health on the HTTP port. This process is an aiogram poller and
    # serves no HTTP, so that probe can only fail. Off until the bot has a
    # liveness signal of its own.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      APP_PASS_SECRET: ${APP_PASS_SECRET}
      MINI_APP_URL: ${MINI_APP_URL}
      SUPPORT_CHAT_ID: ${SUPPORT_CHAT_ID:-}
      PARSER_PROVIDER: ${PARSER_PROVIDER:-}
      PARSER_API_KEY: ${PARSER_API_KEY:-}
      PARSER_MODEL: ${PARSER_MODEL:-}
      DAILY_MODEL_CALL_LIMIT: ${DAILY_MODEL_CALL_LIMIT:-50}
      DAILY_UNPARSED_LIMIT: ${DAILY_UNPARSED_LIMIT:-20}
      RECEIPT_PHOTO_ENABLED: ${RECEIPT_PHOTO_ENABLED:-}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/logs/app.log}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: chontak-web:latest
    restart: unless-stopped
    environment:
      # Where nginx forwards /api/... — no trailing slash.
      BACKEND_URL: ${BACKEND_URL:-http://api:${API_PORT:-5001}}
    expose:
      - "80"
    depends_on:
      bot:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
